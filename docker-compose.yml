# ── GetThatQuick — Docker Compose ──────────────────────────────────────────
#
# Single-container setup. Data is persisted at ~/getthatquick on the host.
#
# Usage:
#   docker compose pull              # Pull latest GHCR image
#   docker compose up -d             # Start in background
#   docker compose down              # Stop
#
# Access the app at: http://localhost:12233

services:
  app:
    image: ${GTQ_IMAGE:-ghcr.io/gurkirat-singh-bit/get-that-quick:latest}
    container_name: getthatquick
    ports:
      - "12233:3000"
    volumes:
      - ~/getthatquick:/data
    environment:
      - PORT=3000
      - DATA_DIR=/data
    restart: unless-stopped
